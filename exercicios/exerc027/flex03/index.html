<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: burlywood;
            display: flex;
            flex-flow: row rap;
            /*flex-direction: column;
            flex-wrap: wrap;  /* Permite que os itens quebrem linha se necessário*/
           /* flex-direction: row;*/
           /* flex-wrap: wrap; Permite que os itens quebrem linha se necessário*/
            /*flex-wrap: wrap-reverse;
             Os itens quebram linha de baixo para cima */
        }
        div.item {
            text-align: center;
            background-color: lightblue;
            border: 1px solid black;
            
            border-radius: 3px 5px;
            flex: auto;/* Cada item ocupará o mesmo espaço disponível  o iten ficara flexivel*/
        }
        div.conteinerr {
            background-color: lightgrey;
            display: flex;
        }
        div.itens {
            text-align: center;
            background-color: lightcoral;
            border: 1px solid black;
            padding: 10px;
            margin: 5px;
            flex: 2; /* Cada item ocupará o dobro do espaço disponível */
            flex-grow: 1; /* Permite que os itens cresçam igualmente */
            flex-basis: 100px; /* Tamanho base de cada item */
            flex-shrink: 1; /* Permite que os itens encolham se necessário */

        }
    </style>
</head>
<body>
    <div class="conteiner">
        
        <div class="item">Exemplo de blocoA</div> 
        <div class="item">Exemplo de blocoB</div>
        <div class="item">Exemplo de blocoC</div>
        <div class="item">Exemplo de blocoD</div>
        <div class="item">Exemplo de blocoE</div>
        <div class="item">Exemplo de blocoF</div>
        <div class="item">Exemplo de blocoG</div>
    </div><br><br>
    <div class="conteinerr">
        <div class="itens">casa</div>
        <div class="itens">casa</div>
        <div class="itens">casa</div>
    </div>
</body>
</html>
